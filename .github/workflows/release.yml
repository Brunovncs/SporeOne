name: Release

# Push a tag like v0.0.1, matching the version in Cargo.toml, to build the Windows zip and
# installer and publish them as a release whose notes are that version's section of CHANGELOG.md.
# Nothing is signed: SmartScreen warns on first launch. Run by hand, it is a rehearsal: the
# packages are built and kept with the run, and nothing is published.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Only the job that publishes may write: the build runs hundreds of crates' build scripts.
permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the tag against Cargo.toml and CHANGELOG.md
        id: check
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ "$GITHUB_REF_TYPE" != tag ] || [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME does not match version $version in Cargo.toml"; exit 1; }
          [ "$GITHUB_REF_TYPE" != tag ] || grep -qx "## $version" CHANGELOG.md || { echo "CHANGELOG.md has no section for $version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

  windows:
    needs: version
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: false
      - name: Tests
        run: cargo test --workspace --locked
      - name: Build
        run: cargo build --release -p sporeone --locked
      # The release build compiles the window's shaders ahead of time, which the debug build in
      # CI never does: the program is started once as it ships.
      - name: Smoke test
        shell: pwsh
        run: |
          $p = Start-Process target\release\sporeone.exe -ArgumentList '--smoke' -PassThru -Wait -NoNewWindow
          exit $p.ExitCode
      - name: No Visual C++ runtime needed
        shell: pwsh
        run: |
          if (Select-String -Path target\release\sporeone.exe -Pattern 'vcruntime140' -SimpleMatch -Quiet) { throw "sporeone.exe needs VCRUNTIME140.dll" }
      - name: Package
        shell: pwsh
        run: |
          $name = "sporeone-${{ needs.version.outputs.version }}-windows-x64"
          New-Item -ItemType Directory "dist\$name" | Out-Null
          Copy-Item target\release\sporeone.exe, README.md, LICENSE, THIRD_PARTY_NOTICES.md, CHANGELOG.md "dist\$name"
          Compress-Archive -Path "dist\$name" -DestinationPath "dist\$name.zip"
          (Get-FileHash "dist\$name.zip" -Algorithm SHA256).Hash.ToLower() + "  $name.zip" | Out-File -Encoding ascii "dist\$name.zip.sha256"
      - name: Installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y | Out-Null }
          & $iscc /Qp /DVersion=${{ needs.version.outputs.version }} /DBuild=target\release packaging\windows\sporeone.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $setup = "sporeone-${{ needs.version.outputs.version }}-windows-x64-setup.exe"
          (Get-FileHash "dist\$setup" -Algorithm SHA256).Hash.ToLower() + "  $setup" | Out-File -Encoding ascii "dist\$setup.sha256"
      # A new install, an update over it, and an uninstall that removes it.
      - name: Install, update and uninstall
        shell: pwsh
        timeout-minutes: 10
        run: |
          $setup = (Get-ChildItem dist\*-setup.exe | Select-Object -First 1).FullName
          $app = "$env:LOCALAPPDATA\Programs\sporeone"
          (Start-Process $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -PassThru).WaitForExit()
          if (-not (Test-Path "$app\sporeone.exe")) { throw "the installer did not install" }
          (Start-Process $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -PassThru).WaitForExit()
          (Start-Process "$app\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES' -PassThru).WaitForExit()
          $deadline = (Get-Date).AddSeconds(60)
          while ((Test-Path "$app\sporeone.exe") -and (Get-Date) -lt $deadline) { Start-Sleep 1 }
          if (Test-Path "$app\sporeone.exe") { throw "the uninstaller left the program behind" }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x64
          path: |
            dist/*.zip*
            dist/*-setup.exe*

  publish:
    needs: [version, windows]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Release notes
        run: |
          awk -v v="## ${{ needs.version.outputs.version }}" '$0 == v {on=1; next} /^## / {on=0} on' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "SporeOne ${{ needs.version.outputs.version }}" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --verify-tag
