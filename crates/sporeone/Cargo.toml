[package]
name = "sporeone"
description = "A catalog of Spore mods that installs them in one click, through the Launcher Kit's own records"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "sporeone"
path = "src/main.rs"

[dependencies]
sporeone-core.workspace = true
# GPUI is published by the gpui-kit maintainers as `gpui-pre-*` snapshots of Zed; the crate
# names inside are still `gpui` and `gpui_platform`. Pinned exactly: its API moves with Zed.
gpui = { package = "gpui-pre", version = "=0.3.7" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.7", features = ["font-kit", "wayland", "x11"] }
serde_json.workspace = true
unicode-segmentation = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_Registry"] }

[build-dependencies]
embed-resource = "3"
